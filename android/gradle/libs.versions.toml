[versions]
agp = "8.2.0"
kotlin = "1.9.23"
compose-bom = "2024.10.00"
compose-compiler = "1.5.14"
core-ktx = "1.13.1"
activity-compose = "1.9.0"
fragment = "1.6.2"
lifecycle-viewmodel-compose = "2.8.2"
lifecycle-runtime-compose = "2.8.2"
navigation-compose = "2.7.7"
hilt = "2.50"
retrofit = "2.11.0"
okhttp = "4.12.0"
converter-gson = "2.11.0"
gson = "2.10.1"
coil = "2.7.0"
work-runtime-ktx = "2.10.1"
biometric = "1.1.0"
androidx-browser = "1.8.0"
junit = "4.13.2"
androidx-test-core = "1.5.0"
robolectric = "4.11"
okhttp-mockwebserver = "4.12.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version = "core-ktx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version = "activity-compose" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version = "fragment" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version = "lifecycle-viewmodel-compose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version = "lifecycle-runtime-compose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version = "navigation-compose" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version = "work-runtime-ktx" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version = "biometric" }
androidx-browser = { group = "androidx.browser", name = "browser", version = "androidx-browser" }
androidx-test-core = { group = "androidx.test.ext", name = "junit", version = "androidx-test-core" }
androidx-test-runner = { group = "androidx.test", name = "runner", version = "1.5.2" }
androidx-test-rules = { group = "androidx.test", name = "rules", version = "1.5.0" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material = { group = "androidx.compose.material3", name = "material3" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }

hilt-gradle-plugin = { group = "com.google.dagger", name = "hilt-android-gradle-plugin", version = "hilt" }
hilt-library = { group = "com.google.dagger", name = "hilt-android", version = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version = "hilt" }

retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version = "converter-gson" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version = "okhttp-mockwebserver" }
gson = { group = "com.google.code.gson", name = "gson", version = "gson" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version = "1.8.0" }
coil-core = { group = "io.coil-kt.coil", name = "coil", version = "coil" }

junit = { group = "junit", name = "junit", version = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.android.parcelize", version.ref = "kotlin" }
