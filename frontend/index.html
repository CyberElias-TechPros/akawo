<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akawo — Save together, build what matters</title>
    <meta
      name="description"
      content="Akawo is a Nigerian savings and contribution platform. Create contributions, pay securely by card or bank-transfer proof, and verify your identity in minutes."
    />
    <meta name="theme-color" content="#0A3D2D" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Akawo" />
    <meta property="og:title" content="Akawo — Save together, build what matters" />
    <meta
      property="og:description"
      content="A Nigerian savings and contribution platform. Create contributions, pay by card or transfer proof, verify your identity in minutes."
    />
    <meta property="og:locale" content="en_NG" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Akawo — Save together, build what matters" />
    <meta
      name="twitter:description"
      content="A Nigerian savings and contribution platform. Pay by card or transfer proof, verify your identity in minutes."
    />

    <!-- Fonts: Fraunces (display serif) + Inter (UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Akawo",
        "description": "Nigerian savings and contribution platform",
        "inLanguage": "en-NG"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Akawo",
        "description": "Akawo helps Nigerians pool contributions, pay them securely, and verify identity for trusted savings.",
        "areaServed": "NG",
        "knowsAbout": ["savings", "contributions", "digital payments", "KYC"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Akawo requires JavaScript to run. Please enable it to continue.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
