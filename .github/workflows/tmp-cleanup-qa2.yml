name: tmp-cleanup-qa2
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Delete QA test user from som-connect-db
        run: |
          U="u_muzsxvu8_6hweiur"
          npx -y wrangler@latest d1 execute som-connect-db --remote --command "DELETE FROM users WHERE id='$U';"
          npx -y wrangler@latest d1 execute som-connect-db --remote --command "SELECT count(*) AS remaining FROM users WHERE id='$U';"
      - name: Delete QA testimony from ttin-db
        run: |
          npx -y wrangler@latest d1 execute ttin-db --remote --command "DELETE FROM testimonies WHERE id='d5a6cb0900e0ea5e0e6b3a74';"
          npx -y wrangler@latest d1 execute ttin-db --remote --command "SELECT count(*) AS remaining FROM testimonies WHERE id='d5a6cb0900e0ea5e0e6b3a74';"
