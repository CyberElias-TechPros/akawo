name: tmp-check-ahh
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Dump schema + row counts (read-only)
        run: |
          npx -y wrangler@latest d1 execute agently-home-hub-db --remote --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"
          npx -y wrangler@latest d1 execute agently-home-hub-db --remote --command "SELECT sql FROM sqlite_master WHERE name='properties';"
          npx -y wrangler@latest d1 execute agently-home-hub-db --remote --command "SELECT count(*) AS properties FROM properties;"
          npx -y wrangler@latest d1 execute agently-home-hub-db --remote --command "SELECT count(*) AS users FROM users;"
          npx -y wrangler@latest d1 execute agently-home-hub-db --remote --command "SELECT * FROM d1_migrations ORDER BY id;"
