name: tmp-mig-som
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Clone target repo
        run: git clone --depth 1 https://x-access-token:${{ secrets.MIGRATION_PAT }}@github.com/CyberElias-TechProS/som-connect-hub.git target
      - name: Check tables (read-only)
        run: npx -y wrangler@latest d1 execute som-connect-db --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'd1_%' AND name NOT LIKE '_cf_%' ORDER BY name;"
      - name: Apply schema+seed only if database is empty
        working-directory: target
        run: |
          N=$(npx -y wrangler@latest d1 execute som-connect-db --remote --json --command "SELECT count(*) AS n FROM sqlite_master WHERE type='table' AND name NOT LIKE 'd1_%' AND name NOT LIKE '_cf_%';" | grep -oE '"n": [0-9]+' | grep -oE '[0-9]+')
          echo "user_tables=$N"
          if [ "$N" = "0" ]; then
            npx -y wrangler@latest d1 execute som-connect-db --remote --file=worker/src/db/schema.sql
            npx -y wrangler@latest d1 execute som-connect-db --remote --file=worker/src/db/seed.sql
          else
            echo "tables present; skipping schema/seed"
          fi
      - name: Ensure R2 + queue exist
        run: |
          npx -y wrangler@latest r2 bucket list --json | grep -q som-connect-storage \
            || npx -y wrangler@latest r2 bucket create som-connect-storage
          npx -y wrangler@latest queues list --json | grep -q som-connect-queue \
            || npx -y wrangler@latest queues create som-connect-queue
      - name: Ensure JWT_SECRET (only if absent)
        run: |
          HAVE=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/som-connect-api/secrets" | grep -c JWT_SECRET || true)
          echo "present=$HAVE"
          if [ "$HAVE" = "0" ]; then
            curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/som-connect-api/secrets" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              --data "$(jq -n --arg t "${{ secrets.TMP_SOM_JWT }}" '{name:"JWT_SECRET",text:$t,type:"secret_text"}')"
          fi
      - name: Install deps and deploy worker
        run: |
          npm ci --no-fund --no-audit --prefix target
          cd target/worker && npx -y wrangler@latest deploy
      - name: Verify health
        run: |
          body="$(curl -fsS https://som-connect-api.cyberelias-tk.workers.dev/health)"
          echo "$body"; echo "$body" | grep -q '"status":"ok"'
