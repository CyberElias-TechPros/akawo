name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  worker:
    name: API — typecheck + 69 integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # Integration tests boot the worker under miniflare, which reads
      # secrets from .dev.vars (never committed). LOCAL_DEV=true enables
      # the test-only /api/test/reset endpoint the suite requires, and
      # EXPOSE_RESET_LINKS=true makes the suite's token assertions work.
      - name: Write test .dev.vars
        run: |
          printf 'JWT_ACCESS_SECRET=%s\nJWT_REFRESH_SECRET=%s\nLOCAL_DEV=true\nEXPOSE_RESET_LINKS=true\n' "$JWT_ACCESS_SECRET" "$JWT_REFRESH_SECRET" > .dev.vars
        env:
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      - run: npm test
        env:
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}

  frontend:
    name: Web — typecheck + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Lockfile is generated with npm 11 (nested optional deps); the npm 10
      # bundled with Node 22 rejects `npm ci` on it. Align before installing.
      - run: npm install -g npm@11
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
