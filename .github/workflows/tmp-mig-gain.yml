name: tmp-mig-gain
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Clone target repo
        run: git clone --depth 1 --branch main https://x-access-token:${{ secrets.MIGRATION_PAT }}@github.com/CyberElias-TechProS/see-my-business-contact-gain.git target
      - name: Install deps
        working-directory: target
        run: npm ci --no-fund --no-audit
      - name: Ensure R2 bucket
        run: |
          npx -y wrangler@latest r2 bucket list --json | grep -q gainhub-evidence-production \
            || npx -y wrangler@latest r2 bucket create gainhub-evidence-production
      - name: Show applied migrations
        working-directory: target
        run: npx -y wrangler@latest d1 migrations list gainhub-production --remote --env production
      - name: Apply outstanding migrations
        working-directory: target
        run: npx -y wrangler@latest d1 migrations apply gainhub-production --remote --env production
      - name: Deploy worker
        working-directory: target
        run: npx -y wrangler@latest deploy --env production
      - name: Verify health
        run: |
          body="$(curl -fsS https://gainhub-api-production.cyberelias-tk.workers.dev/api/health)"
          echo "$body"; echo "$body" | grep -q '"status":"ok"'
